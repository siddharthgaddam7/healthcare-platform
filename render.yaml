# Render Blueprint — only used if you create/update the service from this file in the Render UI.
# An existing Web Service ignores this file unless you use "Blueprints" / IaC sync.
# For a normal Web Service: set Start Command in the dashboard to:
#   gunicorn --bind 0.0.0.0:$PORT app:app
# Or rely on backend/Procfile (Render runs the `web` process from the service root directory).

services:
  - type: web
    name: clinixcompare-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: EMAIL_TEST_MODE
        sync: false
      - key: BOOKING_EMAIL_BCC
        sync: false
